<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- App Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Playful Decorative Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="16" stroke-dasharray="24 16" />

  <!-- Center Mascot Smiling Star -->
  <g filter="url(#shadow)">
    <!-- Golden Star -->
    <path d="M 256 90 L 302 186 L 406 200 L 330 274 L 350 376 L 256 326 L 162 376 L 182 274 L 106 200 L 210 186 Z"
          fill="#FBBF24" stroke="#F59E0B" stroke-width="12" stroke-linejoin="round" />

    <!-- Cute Eyes -->
    <ellipse cx="225" cy="245" rx="12" ry="16" fill="#1E293B" />
    <circle cx="228" cy="240" r="5" fill="#FFFFFF" />
    <ellipse cx="287" cy="245" rx="12" ry="16" fill="#1E293B" />
    <circle cx="290" cy="240" r="5" fill="#FFFFFF" />

    <!-- Cute Rosy Cheeks -->
    <circle cx="205" cy="265" r="10" fill="#F43F5E" opacity="0.6" />
    <circle cx="307" cy="265" r="10" fill="#F43F5E" opacity="0.6" />

    <!-- Happy Smile -->
    <path d="M 235 268 Q 256 295 277 268" fill="none" stroke="#1E293B" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Floating Letters: A, 1, ሀ -->
  <!-- Block A -->
  <g transform="translate(68, 330)" filter="url(#shadow)">
    <rect width="80" height="80" rx="20" fill="#10B981" />
    <text x="40" y="55" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle">A</text>
  </g>

  <!-- Block 1 -->
  <g transform="translate(216, 370)" filter="url(#shadow)">
    <rect width="80" height="80" rx="20" fill="#F97316" />
    <text x="40" y="55" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text>
  </g>

  <!-- Block ሀ -->
  <g transform="translate(364, 330)" filter="url(#shadow)">
    <rect width="80" height="80" rx="20" fill="#EC4899" />
    <text x="40" y="55" font-family="system-ui, sans-serif" font-size="42" font-weight="900" fill="#FFFFFF" text-anchor="middle">ሀ</text>
  </g>
</svg>
